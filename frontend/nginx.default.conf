# frontend/nginx.default.conf
server {
   listen 80;
   server_name localhost; # Or your domain

   root /usr/share/nginx/html;
   index index.html index.htm;

   location / {
       try_files $uri $uri/ /index.html;
   }

   # Proxy API requests to the backend service
   # VITE_API_BASE_URL in React should be /api/v1
   location /api/v1/ {
       # Strip the /api/v1 prefix before forwarding to the backend
       rewrite ^/api/v1/(.*)$ /$1 break;

       # The backend service is named 'backend' in docker-compose.yml
       proxy_pass http://backend:8000;

       proxy_set_header Host $host;
       proxy_set_header X-Real-IP $remote_addr;
       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
       proxy_set_header X-Forwarded-Proto $scheme;

       proxy_http_version 1.1; # Recommended for keepalive connections
       proxy_set_header Upgrade $http_upgrade;
       proxy_set_header Connection "upgrade";
   }

    # Health check endpoint for Nginx itself (optional)
    location /nginx_health {
        return 200 'Nginx is healthy';
        access_log off;
    }
}
